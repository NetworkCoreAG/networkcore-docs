      description: Returns all agreements that have an explicit row (default-active pairs with no configuration do not appear).
      tags: [Admin – Partnerships]
      security:
        - AdminKey: []
      responses:
        '200':
          description: Agreement list
          content:
            application/json:
              schema:
                type: object
                properties:
