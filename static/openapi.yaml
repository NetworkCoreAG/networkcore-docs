        '403': { $ref: '#/components/responses/Forbidden' }

  /portal/v1/cpo/partners/{dp_party_id}/block:
    patch:
      summary: Block a DP
      description: Opt out of collaboration with a specific DP. Their drivers will not be attributed to sessions at your stations.
      tags: [CPO Partners]
      security:
        - PortalBearer: []
      parameters:
        - in: path
          name: dp_party_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Updated agreement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerAgreement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /portal/v1/cpo/partners/{dp_party_id}/unblock:
    patch:
      summary: Unblock a DP
      tags: [CPO Partners]
      security:
        - PortalBearer: []
      parameters:
        - in: path
          name: dp_party_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated agreement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerAgreement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /portal/v1/cpo/partners/{dp_party_id}/discount/offer:
    post:
      summary: Offer a discount to a DP
      description: |
        CPO proposes a discount on the public tariff price for a specific DP.
        The DP will see a pending offer and must accept or reject it.

        Once accepted, the discount is applied at clearing time:
        **effective_gross = CDR_gross × (1 − discount_pct)**
        The 90/5/5 split then runs on the effective gross, so all parties
        proportionally share the discount.
      tags: [CPO Partners]
      security:
        - PortalBearer: []
      parameters:
        - in: path
          name: dp_party_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discount_pct]
              properties:
                discount_pct:
                  type: number
                  description: Decimal 0–1 (e.g. 0.10 for 10% off)
                  example: 0.10
                note:
                  type: string
                  example: "Partnership agreement Q2-2026"
      responses:
        '201':
          description: Proposal sent — status moves to DISCOUNT_PENDING_DP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerAgreement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /portal/v1/cpo/partners/{dp_party_id}/discount/respond:
    patch:
      summary: Accept or reject a DP's discount request
      tags: [CPO Partners]
      security:
        - PortalBearer: []
      parameters:
        - in: path
          name: dp_party_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, reject]
                effective_from:  { type: string, format: date, nullable: true }
                effective_until: { type: string, format: date, nullable: true }
                note:            { type: string }
      responses:
        '200':
          description: Updated agreement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerAgreement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /portal/v1/cpo/partners/{dp_party_id}/discount:
    delete:
