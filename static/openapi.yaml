        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/partnerships/discount:
    post:
      summary: Admin-set or clear a partner discount (override)
      description: |
        Directly sets or clears an active discount on a CPO-DP pair.
        Bypasses the negotiation workflow — useful for initial setup or corrections.
        Set `discount_pct` to `null` to remove the discount.
      tags: [Admin – Partnerships]
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpo_party_id, dp_party_id]
              properties:
                cpo_party_id:    { type: string, format: uuid }
                dp_party_id:     { type: string, format: uuid }
                discount_pct:
                  type: number
                  nullable: true
                  description: Decimal 0–1 (e.g. 0.10 for 10%). null = remove.
                  example: 0.10
                effective_from:  { type: string, format: date }
                effective_until: { type: string, format: date, nullable: true }
                note:            { type: string }
      responses:
        '200':
          description: Updated agreement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerAgreement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

