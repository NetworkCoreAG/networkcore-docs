  /portal/v1/cpo/invoices/export.zip:
    get:
      summary: CPO – download invoices as ZIP
      operationId: cpoBulkInvoiceExport
      tags: [Portal API]
      description: |
        Streams a ZIP archive of CFDIs (PDF + XML) for the given period.
        Always includes a `manifest.csv` compatible with ContpaqI and Aspel SAE for direct import.

        ZIP structure:
        ```
        facturas-cpo-YYYY-MM-DD.zip
          YYYY-MM-DD/
            cliente/   {uuid}.pdf  {uuid}.xml    ← customer invoice
            comision/  {uuid}.pdf  {uuid}.xml    ← commission invoice
          manifest.csv
        ```
      security:
        - PortalBearer: []
      parameters:
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date-time, example: '2026-04-01T00:00:00Z' }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date-time, example: '2026-04-13T23:59:59Z' }
        - name: format
          in: query
          description: File types to include in the ZIP
          schema:
            type: string
            enum: [both, pdf, xml]
            default: both
      responses:
        '200':
          description: ZIP file stream
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404':
          description: No invoices found for the period

  /portal/v1/cpo/invoices/{facturapi_id}/pdf:
    get:
      summary: CPO – download single invoice PDF
      operationId: cpoInvoicePdf
      tags: [Portal API]
      security:
        - PortalBearer: []
      parameters:
        - name: facturapi_id
          in: path
          required: true
          schema: { type: string }
          description: FacturAPI invoice ID (from invoice list or invoice.issued webhook)
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403':
          description: Invoice not found or not yours

  /portal/v1/cpo/invoices/{facturapi_id}/xml:
    get:
      summary: CPO – download single invoice XML (CFDI)
      operationId: cpoInvoiceXml
      tags: [Portal API]
