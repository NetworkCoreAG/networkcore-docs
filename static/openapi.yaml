              schema:
                $ref: '#/components/schemas/DpSession'
        '404':
          $ref: '#/components/responses/NotFound'

  /dp/v1/sessions/{session_id}/stream:
    get:
      summary: Real-time SSE stream for a single session
      operationId: dpSessionStream
      tags: [DP API]
      description: |
        Server-Sent Events stream that pushes live updates for the specified session.
        The browser `EventSource` API cannot set custom headers, so authentication
        falls back to a query parameter when no `X-Api-Key` header is present.
        Use `?api_key=<key>` for browser / iframe contexts.

        Events pushed:
        - `session_update` — session status or energy changed
        - `payment_confirmed` — payment authorization received
        - `session_settled` — clearing complete, financial split available
      security:
        - DpApiKey: []
      parameters:
        - $ref: '#/components/parameters/session_id'
        - name: api_key
          in: query
          description: >
            API key fallback for browser EventSource contexts that cannot send
            custom headers (HTML5 spec restriction). Equivalent to `X-Api-Key`.
          schema:
            type: string
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event line is `data: <JSON>\n\n`.

                  **session_update**
                  ```json
                  { "event": "session_update", "session_id": "uuid", "status": "ACTIVE",
                    "kwh": 12.4, "updated_at": "2026-04-09T14:00:00Z" }
                  ```

                  **session_settled**
                  ```json
                  { "event": "session_settled", "session_id": "uuid",
                    "gross_amount": 150.00, "dp_amount": 7.50, "currency": "MXN" }
                  ```
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

