  # ── Inbound Platform Webhooks ─────────────────────────────────────────────────
  /webhooks/sdk-finance:
    post:
      summary: SDK.finance event webhook
      operationId: receiveSDKFinanceWebhook
      tags: [Platform Webhooks]
      description: |
        Receives signed event notifications from the self-hosted SDK.finance instance.
        Verify the `X-SDKFinance-Signature` HMAC-SHA256 header before processing.

        Supported event types:
        - `KYC_CHECK_REQUIRED` — profile KYC status changed to pending
        - `GATE_TOPUP_INITIATED` — a wallet top-up was initiated
        - `GATE_WITHDRAWAL_INITIATED` — a withdrawal/payout was initiated

        All received events are persisted to `sdk_webhook_events` for audit and replay.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, eventType, createdAt]
              properties:
                id:
                  type: string
                  description: Unique event ID (used for idempotency)
                  example: "sdk-evt-abc123"
                eventType:
                  type: string
                  enum: [KYC_CHECK_REQUIRED, GATE_TOPUP_INITIATED, GATE_WITHDRAWAL_INITIATED]
                resourceId:
                  type: string
                  description: Associated SDK.finance profile or wallet ID
                createdAt:
                  type: string
                  format: date-time
                data:
                  type: object
                  additionalProperties: true
                  description: Event-specific payload fields
      responses:
        '200':
          description: Event received and accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        '400':
          description: Invalid signature or malformed payload
        '409':
          description: Duplicate event ID (already processed)

  /stp/webhook/estado:
    post:
      summary: STP SPEI transfer status webhook
      operationId: receiveStpEstado
      tags: [Platform Webhooks]
      description: |
        Receives SPEI transfer confirmation events from STP (Sistema de Transferencias y Pagos).
        NetworkCore verifies the signature, matches the tracking key to a pending settlement batch,
        and marks it as confirmed.

        STP posts this when a SPEI transfer changes state (completed, returned, error).
        The `claveRastreo` field is matched against `settlement_batches.stp_tracking_key`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: STP estado payload (STP-defined schema)
              properties:
                id:
                  type: integer
                  description: STP internal transfer ID
                claveRastreo:
                  type: string
                  description: Tracking key — matches stp_tracking_key in settlement_batches
                  example: "NC-20260409-001"
                estado:
                  type: string
                  description: Transfer state
                  enum: [LIQUIDADA, DEVUELTA, ERROR]
                causaDevolucion:
                  type: string
                  description: Return reason code (only present when estado=DEVUELTA)
                  nullable: true
                monto:
                  type: number
                  description: Transfer amount in MXN
                  example: 1500.00
                fechaOperacion:
                  type: integer
                  description: Operation date (YYYYMMDD integer format)
                  example: 20260409
      responses:
        '200':
          description: Status update received and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true

