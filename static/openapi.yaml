        - PortalBearer: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, week, month, custom]
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CpoAnalyticsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portal/v1/cpo/analytics/stations:
    get:
      summary: CPO – per-location performance metrics
      operationId: portalCpoAnalyticsStations
      tags: [Analytics]
      security:
        - PortalBearer: []
      responses:
        '200':
          description: Per-location analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        location_id:
                          type: string
                          format: uuid
                        location_name:
                          type: string
                        session_count:
                          type: integer
                        total_kwh:
                          type: number
                        gross_revenue_mxn:
                          type: number
                        evse_count:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portal/v1/cpo/analytics/peak-hours:
    get:
      summary: CPO – session count by hour (Mexico City time, 24 elements)
      operationId: portalCpoAnalyticsPeakHours
      tags: [Analytics]
      security:
        - PortalBearer: []
      responses:
        '200':
          description: 24-element array of session counts indexed by hour (0–23)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    minItems: 24
                    maxItems: 24
                    items:
                      type: integer
                    description: Index 0 = midnight, index 23 = 23:00 Mexico City time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portal/v1/cpo/analytics/sessions/trend:
    get:
      summary: CPO – daily session and revenue time series
      operationId: portalCpoAnalyticsSessionsTrend
      tags: [Analytics]
      security:
        - PortalBearer: []
      responses:
        '200':
          description: Daily time series
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        session_count:
                          type: integer
                        gross_mxn:
                          type: number
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── DP API – Driver Notifications ─────────────────────────────────────────
  /dp/v1/drivers/{dp_driver_ref}/notifications/prefs:
    post:
      summary: Set driver notification preferences
      operationId: dpSetDriverNotificationPrefs
      tags: [Driver Notifications]
      security:
        - DpApiKey: []
      parameters:
        - name: dp_driver_ref
          in: path
          required: true
          schema:
            type: string
          description: DP-issued driver reference identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefs]
              properties:
                prefs:
                  type: array
                  items:
                    type: object
                    required: [channel, event_type, enabled]
                    properties:
                      channel:
                        type: string
                        description: Notification delivery channel (e.g. push, email, sms)
                      event_type:
                        type: string
                        description: Event that triggers the notification (e.g. session.started, session.completed, cost_alert)
                      enabled:
                        type: boolean
                      cost_alert_threshold_mxn:
                        type: number
                        description: Only relevant for cost_alert event type
      responses:
        '200':
          description: Preferences saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: integer
                    description: Number of preference records saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── DP API – Driver Session History ───────────────────────────────────────
  /dp/v1/drivers/{dp_driver_ref}/sessions:
    get:
      summary: Driver session history
      operationId: dpGetDriverSessions
      tags: [DP API]
      security:
        - DpApiKey: []
      parameters:
        - name: dp_driver_ref
          in: path
          required: true
          schema:
            type: string
          description: DP-issued driver reference identifier
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Return sessions started on or after this timestamp
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, completed, failed, refunded]
      responses:
        '200':
          description: Driver session history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ocpi_session_id:
                          type: string
                        status:
                          type: string
                          enum: [pending, active, completed, failed, refunded]
                        location_id:
                          type: string
                        evse_uid:
                          type: string
                        started_at:
                          type: string
                          format: date-time
                        ended_at:
                          type: string
                          format: date-time
                        total_energy_kwh:
                          type: number
                        total_cost_mxn:
                          type: number
                        invoice_pdf_url:
                          type: string
                          format: uri
                          nullable: true
                        invoice_uuid:
                          type: string
                          format: uuid
                          nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── DP API – Driver Invoice History ───────────────────────────────────────
  /dp/v1/drivers/{dp_driver_ref}/invoices:
    get:
      summary: Driver invoice history
      operationId: dpGetDriverInvoices
      tags: [DP API]
      security:
        - DpApiKey: []
      parameters:
        - name: dp_driver_ref
          in: path
          required: true
          schema:
            type: string
          description: DP-issued driver reference identifier
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Return invoices issued on or after this timestamp
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Driver invoice history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        invoice_uuid:
                          type: string
                          format: uuid
                        pdf_url:
                          type: string
                          format: uri
                        xml_url:
                          type: string
                          format: uri
                        session_date:
                          type: string
                          format: date
                        total_mxn:
                          type: number
                        location_id:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── DP API – Push Notifications ───────────────────────────────────────────
  /dp/v1/drivers/push-token:
    post:
      tags: [DP API – Push Notifications]
      summary: Register or refresh device push token
      description: |
        Called by the DP app when the driver first grants push notification permission
        or when the OS rotates the device token (common on iOS).
        Stores the FCM / APNs token in `driver_profiles` so NetworkCore can send
        real-time push notifications for charging events.
      security:
        - DpApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRequest'
            example:
              driver_token_uid: "tok_abc123"
              push_token: "fcm-token-here..."
              push_provider: FCM
      responses:
        '200':
          description: Token registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Admin – Finance Config ────────────────────────────────────────────────────
  /admin/finance-config/{party_id}:
    parameters:
      - name: party_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: NetworkCore internal party ID

    get:
      tags: [Admin – Finance Config]
      summary: Get party finance config
      description: |
        Returns the full `party_finance_config` row for a CPO or DP, including
        fiscal identifiers (RFC, ZIP), banking (CLABE), SDK.finance IDs, and
        FacturAPI org ID. Used by the admin UI Finance Config editor to pre-fill
        the form.
      security:
        - AdminKey: []
      responses:
        '200':
          description: Finance config
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FinanceConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Admin – Finance Config]
      summary: Update party finance config fields
      description: |
        Partial update — only supplied fields are written to the DB.
        All fields are optional; at least one must be provided.
        Validates RFC format, 5-digit ZIP, and 18-digit CLABE.
        Creates an audit log entry (`FINANCE_CONFIG_UPDATED`) on every call.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cpo_rfc:
                  type: string
                  pattern: '^[A-ZÑ&]{3,4}[0-9]{6}[A-Z0-9]{3}$'
                  description: CPO Mexican RFC
                cpo_zip:
                  type: string
                  pattern: '^[0-9]{5}$'
                  description: CPO fiscal postal code (5 digits)
                cpo_legal_name:
                  type: string
                  maxLength: 255
                cpo_clabe:
                  type: string
                  pattern: '^[0-9]{18}$'
                  description: CPO STP CLABE (18 digits)
                dp_rfc:
                  type: string
                  pattern: '^[A-ZÑ&]{3,4}[0-9]{6}[A-Z0-9]{3}$'
                dp_zip:
                  type: string
                  pattern: '^[0-9]{5}$'
                dp_legal_name:
                  type: string
                  maxLength: 255
                sdk_merchant_id:
                  type: string
                sdk_vendor_id:
                  type: string
                facturapi_org_id:
                  type: string
                send_invoice_emails:
                  type: boolean
            example:
              cpo_zip: "06600"
              cpo_rfc: "XAXX010101000"
      responses:
        '200':
          description: Fields updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated:
                        type: boolean
                      party_id:
                        type: string
                        format: uuid
                      fields_updated:
                        type: array
                        items:
                          type: string
                        example: [cpo_zip, cpo_rfc]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Admin – Tax Rates ─────────────────────────────────────────────────────────
  /admin/tax-rates:
    get:
      tags: [Admin – Tax Rates]
      summary: List tax rate windows
      description: |
        Returns all configured IVA / VAT rate windows. Optionally filter by country.
        Used by the admin UI Tax Rates panel and by the invoice engine at stamp time.
      security:
        - AdminKey: []
      parameters:
        - name: country_code
          in: query
          required: false
          schema:
            type: string
            maxLength: 2
          description: Filter by ISO 3166-1 alpha-2 country code (e.g. MX)
          example: MX
      responses:
        '200':
          description: Tax rate list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxRate'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Admin – Tax Rates]
      summary: Create tax rate window
      description: |
        Defines a new IVA / VAT rate effective window for a country + product type.
        Overlapping date ranges for the same country + product type are rejected (409).
        Clears the in-process tax rate cache on success.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_code, product_type, rate, effective_from]
              properties:
                country_code:
                  type: string
                  maxLength: 2
                  example: MX
                product_type:
                  type: string
                  example: CHARGING
                rate:
                  type: number
                  minimum: 0
                  maximum: 1
                  example: 0.16
                label:
                  type: string
                  example: IVA
                effective_from:
                  type: string
                  format: date
                  example: "2024-01-01"
                effective_until:
                  type: string
                  format: date
                  nullable: true
                notes:
                  type: string
                created_by:
                  type: string
      responses:
        '201':
          description: Tax rate created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TaxRate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Overlapping date range for the same country + product type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Admin – Alerts ────────────────────────────────────────────────────────────
  /admin/alerts/config:
    get:
      tags: [Admin – Alerts]
      summary: List alert channel configs
      description: |
        Returns configuration for both SLACK and EMAIL alert channels.
        Webhook URLs are masked to the first 40 characters for security.
      security:
        - AdminKey: []
      responses:
        '200':
          description: Alert channel configs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/alerts/config/{channel}:
    patch:
      tags: [Admin – Alerts]
      summary: Update alert channel config
      description: |
        Enable/disable a channel, set the webhook URL or recipient email,
        configure minimum severity threshold, and optionally filter by alert category.
        Changes take effect immediately for the next alert dispatch.
      security:
        - AdminKey: []
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [SLACK, EMAIL]
          description: Alert channel to configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                webhook_url:
                  type: string
                  description: Full Slack webhook URL (SLACK channel only)
                email_to:
                  type: string
                  description: Recipient email address (EMAIL channel only)
                min_severity:
                  type: string
                  enum: [INFO, WARNING, ERROR, CRITICAL]
                categories:
                  type: array
                  items:
                    type: string
                  nullable: true
                  description: "Alert categories to monitor (null = all)"
            example:
              enabled: true
              min_severity: WARNING
      responses:
        '200':
          description: Config updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AlertConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Prometheus Metrics ────────────────────────────────────────────────────────
  /metrics:
    get:
      tags: [Prometheus]
      summary: Prometheus metrics
      description: |
        Prometheus text-format metrics for scraping by a Prometheus server or
        Grafana Cloud agent. Protected by `X-Admin-Key` in production.

        **Custom metrics exposed:**
        | Metric | Type | Description |
        |--------|------|-------------|
        | `nc_sessions_total` | Counter | Sessions by status |
        | `nc_clearing_mxn_total` | Counter | Gross MXN through clearing |
        | `nc_settlement_batches_total` | Counter | Batches by status + party_type |
        | `nc_job_failures_total` | Counter | Job failures by job_type |
        | `nc_invoice_stamps_total` | Counter | FacturAPI stamps by result |
        | `nc_spei_payouts_total` | Counter | STP payouts by result |
        | `nc_alert_dispatches_total` | Counter | Alert dispatches by channel + severity |
        | `nc_active_sessions` | Gauge | Currently active sessions |
        | `nc_pending_jobs` | Gauge | Jobs awaiting processing |
        | `nc_invoice_stamp_duration_ms` | Histogram | FacturAPI stamp latency |
        | `nc_settlement_duration_ms` | Histogram | Settlement batch duration |
        | `nc_http_request_duration_ms` | Histogram | HTTP request latency by route |

        Plus all standard Node.js process metrics from `prom-client`.
      security:
        - AdminKey: []
      responses:
        '200':
          description: Prometheus text format
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP nc_active_sessions Gauge: sessions in ACTIVE or STOP_REQUESTED state
                # TYPE nc_active_sessions gauge
                nc_active_sessions{service="networkcore-hub"} 12
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Admin – Licensing & Royalty ──────────────────────────────────────────

  /admin/licensing/config:
    get:
      summary: Get licensing configuration
      description: |
        Returns the current TopCo (NetworkCore AG, Switzerland) licensing configuration:
        royalty rate, annual license fee, pass-through costs, bank account details,
        and both company identities used on the internal invoice.
      tags: [Admin – Licensing]
      security:
        - AdminKey: []
      responses:
        '200':
          description: Licensing configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensingConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: Update licensing configuration
      description: |
        Update any subset of licensing configuration fields.
        All fields are optional — only supplied fields are modified.
      tags: [Admin – Licensing]
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topco_legal_name:
                  type: string
                  example: NetworkCore AG
                topco_address:
                  type: string
                  example: "Bahnhofstrasse 10, 8001 Zürich, Switzerland"
                topco_country:
                  type: string
                  maxLength: 2
                  example: CH
                topco_vat_number:
                  type: string
                  example: CHE-123.456.789
                opco_legal_name:
                  type: string
                  example: "NetworkCore México S.A. de C.V."
                opco_rfc:
                  type: string
                  example: NME240101AA1
                opco_address:
                  type: string
                  example: "Av. Insurgentes Sur 1234, CDMX, México"
                royalty_rate_pct:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                  description: Decimal fraction — e.g. 0.07 for 7%
                  example: 0.07
                license_fee_annual_chf:
                  type: number
                  nullable: true
                  description: Total annual license fee in CHF. Set null to disable.
                  example: 24000.00
                license_fee_frequency:
                  type: string
                  enum: [monthly, quarterly, annually]
                  description: |
                    How the annual fee is billed.
                    - monthly: annual ÷ 12 appears in every statement
                    - quarterly: annual ÷ 4 appears in Jan/Apr/Jul/Oct statements
                    - annually: full amount appears in January statement only
                  example: monthly
                passthrough_annual_chf:
                  type: number
                  nullable: true
                  description: Annual pass-through costs total in CHF. Set null to disable.
                  example: 6000.00
                passthrough_frequency:
                  type: string
                  enum: [monthly, quarterly, annually]
                  example: monthly
                passthrough_notes:
                  type: string
                  description: Description of pass-through cost items
                  example: "Cloud infrastructure (AWS), legal & compliance review"
                bank_name:
                  type: string
                  example: UBS AG
                bank_iban:
                  type: string
                  example: CH56 0483 5012 3456 7800 9
                bank_swift:
                  type: string
                  example: UBSWCHZH80A
                bank_account_name:
                  type: string
                  example: NetworkCore AG
                bank_reference_prefix:
                  type: string
                  example: NCR-LIC
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensingConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/licensing/statements/generate:
    post:
      summary: Generate monthly revenue statement
      description: |
        Generates (or regenerates, if still DRAFT) the monthly revenue statement
        for a given calendar month. The statement:

        1. Aggregates `clearing_records` for the period (sessions, gross revenue by category)
        2. Fetches the ECB mid-market MXN/CHF rate for the last business day of the period
        3. Converts Gross Revenue to CHF
        4. Calculates the 7% revenue royalty
        5. Prorates the annual license fee to the billing frequency
        6. Prorates pass-through costs to the billing frequency
        7. Generates a sequential invoice number (e.g. NCR-LIC-2026-04-001)
        8. Saves as DRAFT

        **Requires internet access to `ecb.europa.eu`** — if the ECB fetch fails,
        CHF fields are null and the statement is saved with status DRAFT.

        FINAL and PAID statements cannot be regenerated.
      tags: [Admin – Licensing]
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month]
              properties:
                year:
                  type: integer
                  example: 2026
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 4
                generated_by:
                  type: string
                  description: Identifier of the admin user triggering generation (for audit)
                  example: "ops@networkcore.io"
      responses:
        '201':
          description: Statement generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensingStatement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Statement is FINAL or PAID — cannot regenerate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/licensing/statements:
    get:
      summary: List all licensing statements
      description: Returns all monthly statements ordered newest first.
      tags: [Admin – Licensing]
      security:
        - AdminKey: []
      responses:
        '200':
          description: Statement list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  statements:
                    type: array
                    items:
                      $ref: '#/components/schemas/LicensingStatement'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/licensing/statements/{id}:
    get:
      summary: Get statement detail
      tags: [Admin – Licensing]
      security:
        - AdminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Statement detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensingStatement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update statement status or notes
      description: |
        Promote the statement through its lifecycle:
        - `DRAFT` → `FINAL` (locks figures; sets finalized_at)
        - `FINAL` → `PAID` (marks payment received; sets paid_at)
        - `PAID` statements are immutable

        Also used to add internal notes or record the wire transfer reference.
      tags: [Admin – Licensing]
      security:
        - AdminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [DRAFT, FINAL, PAID]
                notes:
                  type: string
                  description: Internal notes visible only to admin team
                  example: "Reviewed and approved by CFO on 2026-05-03"
                paid_reference:
                  type: string
                  description: Wire transfer reference or confirmation number
                  example: "SWIFT-20260503-7894"
      responses:
        '200':
          description: Updated statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensingStatement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: PAID statements are immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/licensing/statements/{id}/download:
    get:
      summary: Download PDF invoice
      description: |
        Returns the formatted PDF invoice for the statement. The invoice is issued
        by NetworkCore AG (Switzerland / Licensor) to NetworkCore México (OpCo / Licensee).

        The PDF includes:
        - Reporting period + invoice number
        - Gross revenue breakdown (MXN, by transaction category)
        - ECB FX rate and CHF conversion
        - Revenue royalty calculation
        - License fee instalment (with proration note)
        - Pass-through costs
        - Total payable in CHF
        - Licensor bank account details and payment reference

        DRAFT statements include a visible DRAFT badge. The PDF can be downloaded
        at any lifecycle stage.
      tags: [Admin – Licensing]
      security:
        - AdminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PDF invoice
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

